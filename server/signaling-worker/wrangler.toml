# Card Rush signaling server — Cloudflare Workers + Durable Objects (free plan
# compatible: SQLite-backed Durable Objects). Deploy: see README.md.
name = "card-rush-signaling"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional TURN relay (Cloudflare Realtime TURN). Set as SECRETS, never here:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
